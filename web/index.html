<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>rust-kvm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: var(--video-bg);
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 尺寸和位置由 view-panel.js 按显示方式算好直接写上。不用 object-fit，
           它在 canvas 上的支持不稳；直接算框还有个好处：画布元素的布局框正好
           等于画面内容框，ch9329.js 的绝对坐标换算不用改。 */
        #screen {
            display: block;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            color: var(--text);
            font: 12px/1.6 ui-monospace, Consolas, monospace;
        }

        #stats {
            top: 8px;
            left: 8px;
            white-space: pre;
            pointer-events: none;
        }

        #stats.hidden {
            display: none;
        }

        /* ---- 左侧浮动工具栏（布局照搬 chrome-kvm）----
           浮在画面上、垂直居中。半透明毛玻璃比实心块少遮挡。 */
        .floating-toolbar {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 7px;
            background-color: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--tint-08);
            border-left: none;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 8px 24px var(--shadow-color);
            color: var(--text);
            z-index: 1000;
            transition: transform 0.25s ease;
        }

        /* 收起时整条滑出屏幕，只留右侧那截把手 */
        .floating-toolbar.hidden {
            transform: translate(-100%, -50%);
        }

        .floating-toolbar button {
            /* tooltip 要贴着按钮定位，少了这行会以整条工具栏为基准 */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: none;
            border-radius: 10px;
            background-color: transparent;
            color: inherit;
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
        }

        .floating-toolbar button[hidden] {
            display: none;
        }

        .floating-toolbar button:hover {
            background-color: var(--tint-12);
        }

        .floating-toolbar button:active {
            background-color: var(--tint-20);
        }

        .floating-toolbar button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .floating-toolbar button:disabled {
            color: var(--text-disabled);
            cursor: default;
            background-color: transparent;
        }

        .floating-toolbar button svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        /* 状态指示：灰=未连接，绿=正常，黄=可用但有问题，红=失败。
           画面、键鼠、声音各一个。图标本身变色，不另占一行文字。 */
        .status-indicator.status-idle {
            color: var(--text-muted);
        }

        .status-indicator.status-ok {
            color: var(--ok-strong);
        }

        .status-indicator.status-warn {
            color: var(--warn-strong);
        }

        .status-indicator.status-error {
            color: var(--error);
        }

        /* 键盘指示灯：Num / Caps / Scroll 三颗小灯，亮的那颗是绿底 */
        .lock-lights {
            display: flex;
            gap: 2px;
            padding: 1px 0 3px;
        }

        .lock-lights[hidden] {
            display: none;
        }

        .floating-toolbar .lock-light {
            width: 12px;
            height: 18px;
            border-radius: 4px;
            background-color: var(--tint-06);
            color: var(--text-faint);
            font: 600 10px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .floating-toolbar .lock-light:hover {
            background-color: var(--tint-15);
        }

        .floating-toolbar .lock-light[aria-pressed="true"] {
            background-color: var(--ok);
            color: var(--on-primary);
        }

        /* 功能分组之间的细分隔线 */
        .toolbar-divider {
            width: 22px;
            height: 1px;
            margin: 4px 0;
            background-color: var(--tint-12);
        }

        /* 全屏按钮按当前状态切换图标 */
        .icon-exit-fullscreen {
            display: none;
        }

        body.is-fullscreen .icon-enter-fullscreen {
            display: none;
        }

        body.is-fullscreen .icon-exit-fullscreen {
            display: block;
        }

        /* 叠加层关掉之后图标也暗下来，否则看不出当前是开还是关 */
        #toggle-stats.off {
            color: var(--text-disabled);
        }

        /* 录制中必须一眼看得出来——忘了自己在录，磁盘会悄悄被填满 */
        #record.recording {
            color: var(--error);
        }

        .tooltip {
            position: absolute;
            top: 50%;
            left: calc(100% + 10px);
            transform: translateY(-50%);
            background-color: var(--tooltip-bg);
            border: 1px solid var(--tint-10);
            border-radius: 6px;
            padding: 5px 9px;
            font: 12px/1.5 system-ui, sans-serif;
            white-space: pre;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .tooltip::before {
            content: "";
            position: absolute;
            top: 50%;
            right: 100%;
            transform: translateY(-50%);
            border: 5px solid transparent;
            border-right-color: var(--tooltip-bg);
        }

        .floating-toolbar button:hover .tooltip,
        .floating-toolbar button:focus-visible .tooltip {
            opacity: 1;
        }

        /* 显示/隐藏把手 */
        .toggle-button {
            width: 38px;
            height: 26px;
        }

        /* 选择器要够具体才压得住上面的 .floating-toolbar button svg */
        .floating-toolbar .toggle-button svg {
            width: 16px;
            height: 16px;
            transition: transform 0.25s ease;
        }

        /* 收起状态下把手留在屏幕边缘，箭头翻个面 */
        .floating-toolbar.hidden .toggle-button {
            position: absolute;
            top: 50%;
            /* 100% 是内边距盒的右沿，加上 1px 边框才刚好贴住屏幕左边 */
            left: calc(100% + 1px);
            transform: translateY(-50%);
            width: 18px;
            height: 42px;
            background-color: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--tint-08);
            border-left: none;
            border-radius: 0 8px 8px 0;
        }

        .floating-toolbar.hidden .toggle-button svg {
            transform: rotate(180deg);
        }

        .floating-toolbar.hidden .toggle-button .tooltip {
            left: calc(100% + 8px);
        }

        /* 动作的结果提示。图标工具栏里塞不下一行文字，所以做成底部浮出的提示条。
           chrome-kvm 这些用的是 alert()，那会打断操作，而且要多点一下才能继续。 */
        #toast {
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 70vw;
            white-space: pre-wrap;
            text-align: center;
            z-index: 1000;
            transition: opacity 0.2s;
        }

        #toast:empty {
            display: none;
        }

        #toast.ok {
            color: var(--ok);
        }

        #toast.warn {
            color: var(--warn);
        }

        #toast.error {
            color: var(--error);
        }

        #shortcuts.active,
        #ocr.active {
            color: var(--accent);
        }

        /* ---- 文字识别：全屏框选遮罩 + 结果面板 ---- */
        #ocr-overlay {
            position: fixed;
            inset: 0;
            cursor: crosshair;
            background: rgba(0, 0, 0, 0.15);
            /* 盖住画面但让工具栏还能点（工具栏是 1000） */
            z-index: 999;
            touch-action: none;
        }

        #ocr-overlay[hidden],
        #ocr-box[hidden] {
            display: none;
        }

        #ocr-box {
            position: fixed;
            border: 2px solid var(--accent);
            background: rgba(96, 165, 250, 0.15);
            pointer-events: none;
        }

        .ocr-langs {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        #ocr-text {
            box-sizing: border-box;
            width: 100%;
            min-height: 160px;
            padding: 8px;
            border: 1px solid var(--tint-15);
            border-radius: 8px;
            background: var(--input-bg);
            color: inherit;
            font: 13px/1.5 ui-monospace, Consolas, monospace;
            resize: vertical;
        }

        .ocr-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .ocr-actions button {
            padding: 5px 10px;
            border: 1px solid var(--tint-15);
            border-radius: 6px;
            background: var(--tint-06);
        }

        .ocr-actions button.primary {
            margin-left: auto;
            border-color: transparent;
            background: var(--primary);
            color: var(--on-primary);
        }

        .ocr-actions button:disabled {
            color: var(--text-faint);
            cursor: default;
        }

        /* ---- 快捷键面板：贴在工具栏右边，内容多时自己滚动 ---- */
        .tool-panel {
            position: fixed;
            top: 50%;
            left: 64px;
            transform: translateY(-50%);
            width: 340px;
            max-width: calc(100vw - 80px);
            max-height: 86vh;
            overflow-y: auto;
            padding: 10px 12px 12px;
            background-color: var(--glass-strong);
            backdrop-filter: blur(12px);
            border: 1px solid var(--tint-08);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-color);
            color: var(--text);
            font: 13px/1.5 system-ui, sans-serif;
            z-index: 1001;
        }

        .tool-panel[hidden] {
            display: none;
        }

        .tool-panel button {
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        .tool-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 6px 10px;
            border: 1px solid var(--tint-10);
            border-radius: 8px;
            background: var(--tint-04);
            text-align: left;
        }

        .profile-item:hover:not(:disabled) {
            background: var(--tint-12);
        }

        .profile-item.current {
            border-color: var(--accent);
        }

        .profile-item:disabled {
            cursor: default;
            opacity: 0.6;
        }

        .profile-summary {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
            font-size: 12px;
        }

        .atx-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .atx-actions button {
            padding: 7px 10px;
            border: 1px solid var(--tint-10);
            border-radius: 8px;
            background: var(--tint-04);
            text-align: left;
        }

        .atx-actions button[hidden] {
            display: none;
        }

        .atx-actions button:hover:not(:disabled) {
            background: var(--tint-12);
        }

        .atx-actions button:disabled {
            cursor: default;
            opacity: 0.6;
        }

        /* 待确认的那一下要显眼：再点一次就断电了 */
        .atx-actions button.armed,
        #atx-release {
            border-color: var(--error);
            color: var(--error-text);
        }

        .tool-panel a {
            color: var(--accent);
        }

        #view-close,
        #atx-close,
        #profile-close,
        #shortcut-close,
        #ocr-close {
            border: none;
            background: transparent;
            font-size: 18px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
        }

        #view-close:hover,
        #atx-close:hover,
        #profile-close:hover,
        #shortcut-close:hover,
        #ocr-close:hover {
            background-color: var(--tint-12);
        }

        .shortcut-repeat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #shortcut-stop {
            display: none;
            border: 1px solid var(--error);
            background: rgba(248, 113, 113, 0.15);
            color: var(--error-text);
            border-radius: 6px;
            padding: 2px 10px;
        }

        .tool-panel.repeating #shortcut-stop {
            display: inline-block;
        }

        .shortcut-hint {
            margin: 4px 0 8px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .shortcut-group h3,
        .shortcut-form h3 {
            margin: 10px 0 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .shortcut-item {
            display: flex;
            min-width: 0;
        }

        .shortcut-run {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 5px 8px;
            border: 1px solid var(--tint-10);
            border-radius: 8px;
            background: var(--tint-04);
            text-align: left;
        }

        .shortcut-run:hover {
            background: var(--tint-12);
        }

        .shortcut-label,
        .shortcut-combo {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .shortcut-combo {
            font: 11px/1.4 ui-monospace, Consolas, monospace;
            color: var(--accent-text);
        }

        .shortcut-delete {
            margin-left: 2px;
            padding: 0 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
        }

        .shortcut-delete:hover {
            color: var(--error);
            background: var(--tint-08);
        }

        .shortcut-form {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            border-top: 1px solid var(--tint-08);
        }

        .shortcut-form h3 {
            width: 100%;
        }

        .shortcut-form input {
            flex: 1 1 120px;
            min-width: 0;
            padding: 5px 8px;
            border: 1px solid var(--tint-15);
            border-radius: 6px;
            background: var(--input-bg);
            color: inherit;
            font: inherit;
        }

        .shortcut-form button {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: var(--on-primary);
        }

        .shortcut-error {
            width: 100%;
            margin: 0;
            color: var(--error);
            font-size: 12px;
        }

        .shortcut-error:empty {
            display: none;
        }

        .shortcut-form .shortcut-hint {
            width: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="stats" class="overlay hidden">正在连接…</div>
<!-- 图标用内联 SVG：emoji 在各系统上渲染差异太大，且语义常对不上。
     默认收起，只留右边那截把手——画面不该一上来就被挡住。

     串口和鼠标模式不在这儿：那是开机配一次的东西，设置页里已经有了。 -->
<div id="toolbar" class="floating-toolbar hidden">
    <button id="video-status" class="status-indicator status-idle" type="button" aria-label="画面状态">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="6" width="14" height="12" rx="2"/>
            <path d="M22 8l-6 4 6 4V8z"/>
        </svg>
        <span class="tooltip" id="video-status-tip">正在连接…</span>
    </button>
    <button id="input-status" class="status-indicator status-idle" type="button" aria-label="键鼠状态">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="1" y="8" width="14" height="10" rx="2"/>
            <path d="M4 11.5h.01"/>
            <path d="M7.5 11.5h.01"/>
            <path d="M11 11.5h.01"/>
            <path d="M4.5 14.5h6"/>
            <rect x="17" y="6" width="6" height="12" rx="3"/>
            <path d="M20 8.5v2"/>
        </svg>
        <span class="tooltip" id="input-status-tip">未连接串口</span>
    </button>
    <div class="lock-lights" id="lock-lights" role="group" aria-label="键盘指示灯" hidden></div>
    <button id="audio-toggle" class="status-indicator status-idle" type="button" aria-label="声音">
        <svg id="icon-audio-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M22 9l-6 6"/>
            <path d="M16 9l6 6"/>
        </svg>
        <svg id="icon-audio-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" style="display: none" aria-hidden="true">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5.5a9 9 0 0 1 0 13"/>
        </svg>
        <span class="tooltip" id="audio-status">声音已关闭</span>
    </button>

    <div class="toolbar-divider"></div>

    <button id="toggle-stats" type="button" aria-label="连接信息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 16.5v-5.5"/>
            <path d="M12 7.5h.01"/>
        </svg>
        <span class="tooltip" id="stats-tip">显示连接信息</span>
    </button>
    <button id="fullscreen" type="button" aria-label="全屏">
        <svg class="icon-enter-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        </svg>
        <svg class="icon-exit-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
            <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
            <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
            <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
        </svg>
        <span class="tooltip" id="fullscreen-tip">全屏</span>
    </button>
    <button id="view-mode" type="button" aria-label="显示方式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
            <path d="M11 8v6"/>
            <path d="M8 11h6"/>
        </svg>
        <span class="tooltip" id="view-mode-tip">显示方式</span>
    </button>
    <button id="screenshot" type="button" aria-label="截图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>
        <span class="tooltip">截图
按采集卡原始分辨率保存 PNG
并复制到剪贴板</span>
    </button>
    <button id="record" type="button" aria-label="录制">
        <svg id="icon-record" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7" fill="currentColor"/>
        </svg>
        <svg id="icon-stop" viewBox="0 0 24 24" style="display: none" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
        </svg>
        <span class="tooltip" id="record-tip">录制（声音开着就一起录进去）</span>
    </button>

    <div class="toolbar-divider"></div>

    <button id="ocr" type="button" aria-label="识别文字">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <path d="M8 8h8"/>
            <path d="M12 8v8"/>
        </svg>
        <span class="tooltip">识别文字
框选画面上的一块，在本机识别成文字
蓝屏错误码、BIOS 信息都能拿回来</span>
    </button>
    <button id="shortcuts" type="button" aria-label="快捷键">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="tooltip">快捷键
Win+L、Alt+Tab、BIOS 热键等
可以加自定义的</span>
    </button>
    <button id="paste" type="button" aria-label="粘贴文本">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <path d="M9 12h6"/>
            <path d="M9 16h4"/>
        </svg>
        <span class="tooltip">粘贴文本
逐字模拟按键，约 40ms 一个字符
中文等非 US 键盘字符会被跳过</span>
    </button>
    <button id="release-all" type="button" aria-label="强制松开所有键">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M6 9h.01"/>
            <path d="M10 9h.01"/>
            <path d="M7 15h10"/>
            <path d="M3 3l18 18"/>
        </svg>
        <span class="tooltip">强制松开所有键
被控端卡着按键不放时用</span>
    </button>

    <div class="toolbar-divider"></div>

    <button id="atx" type="button" aria-label="ATX 电源" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v10"/>
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
        </svg>
        <span class="tooltip">ATX 电源
开机、关机、强制断电、重启
设置页选了继电器才出现</span>
    </button>
    <button id="profiles" type="button" aria-label="切换被控机" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="13" height="9" rx="1.5"/>
            <rect x="9" y="12" width="13" height="9" rx="1.5"/>
            <path d="M5 15v2a2 2 0 0 0 2 2"/>
            <path d="M19 9V7a2 2 0 0 0-2-2"/>
        </svg>
        <span class="tooltip">切换被控机
在设置页存好的几份配置之间切换</span>
    </button>
    <button id="open-settings" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="tooltip">设置</span>
    </button>
    <button id="reload" type="button" aria-label="刷新页面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2v6h-6"/>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
        <span class="tooltip">刷新</span>
    </button>

    <div class="toolbar-divider"></div>

    <!-- 默认是收起状态，所以初始文案是「展开」 -->
    <button id="collapse" class="toggle-button" type="button" aria-label="展开工具栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
        <span class="tooltip" id="collapse-tip">展开</span>
    </button>
</div>

<div id="view-panel" class="tool-panel" data-toggle="view-mode" hidden>
    <div class="tool-panel-header">
        <span>显示方式</span>
        <button id="view-close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="view-options" class="profile-list"></div>
    <p class="shortcut-hint">放大时画面跟着鼠标走，指针下面就是被控端的那一点。</p>
</div>

<div id="atx-panel" class="tool-panel" data-toggle="atx" hidden>
    <div class="tool-panel-header">
        <span>ATX 电源</span>
        <button id="atx-close" type="button" aria-label="关闭">×</button>
    </div>
    <p class="shortcut-hint" id="atx-info"></p>
    <div class="atx-actions">
        <button id="atx-short" type="button" class="atx-press"></button>
        <button id="atx-long" type="button" class="atx-press"></button>
        <button id="atx-reset" type="button" class="atx-press" hidden></button>
        <button id="atx-release" type="button" hidden>松开</button>
    </div>
    <p class="shortcut-hint">短按开机，或让系统正常关机；长按 6 秒强制断电。长按和复位会丢未保存的
        数据，要连点两下。</p>
</div>

<div id="profile-panel" class="tool-panel" data-toggle="profiles" hidden>
    <div class="tool-panel-header">
        <span>切换被控机</span>
        <button id="profile-close" type="button" aria-label="关闭">×</button>
    </div>
    <p class="shortcut-hint">切换后画面自动重开，键鼠会重新连接到这份配置的串口。</p>
    <div id="profile-list" class="profile-list"></div>
    <p class="shortcut-hint"><a href="settings.html">在设置页添加或修改配置</a></p>
</div>

<div id="shortcut-panel" class="tool-panel" data-toggle="shortcuts" hidden>
    <div class="tool-panel-header">
        <span>快捷键</span>
        <button id="shortcut-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="shortcut-repeat-row">
        <label><input id="shortcut-repeat" type="checkbox"> 开机连按</label>
        <button id="shortcut-stop" type="button">停止连按</button>
    </div>
    <p id="shortcut-repeat-hint" class="shortcut-hint"></p>
    <div id="shortcut-groups"></div>
    <form id="shortcut-form" class="shortcut-form" autocomplete="off">
        <h3>添加自定义</h3>
        <input id="shortcut-label" type="text" maxlength="20" placeholder="名称（可选）">
        <input id="shortcut-combo" type="text" placeholder="如 Ctrl+Alt+F2" required>
        <button type="submit">添加</button>
        <p id="shortcut-error" class="shortcut-error"></p>
        <p class="shortcut-hint">用 + 连接同时按的键；多步用空格隔开，如「Win+R Enter」。修饰键可写 Ctrl、Shift、Alt、Win，Mac 上写 Cmd、Option。</p>
    </form>
</div>

<!-- 框选文字时盖在整个页面上，鼠标键盘都不会漏给被控端 -->
<div id="ocr-overlay" hidden>
    <div id="ocr-box" hidden></div>
</div>

<div id="ocr-panel" class="tool-panel" data-toggle="ocr" hidden>
    <div class="tool-panel-header">
        <span>识别文字</span>
        <button id="ocr-close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="ocr-langs" class="ocr-langs"></div>
    <textarea id="ocr-text" spellcheck="false" placeholder="识别结果会出现在这里，可以直接改"></textarea>
    <div class="ocr-actions">
        <button id="ocr-again" type="button">重新框选</button>
        <button id="ocr-whole" type="button">识别整个画面</button>
        <button id="ocr-copy" type="button" class="primary">复制</button>
    </div>
    <p class="shortcut-hint">识别完全在本机浏览器里进行，画面不会发到任何服务器。第一次用要加载约 10 MB 的引擎和语言包。</p>
</div>

<div id="toast" class="overlay"></div>
<script src="ch9329.js"></script>
<script src="status-text.js"></script>
<script src="serial-ws.js"></script>
<script src="view-modes.js"></script>
<script src="viewer.js"></script>
<script src="input.js"></script>
<script src="audio.js"></script>
<script src="toolbar.js"></script>
<script src="view-panel.js"></script>
<script src="shortcuts.js"></script>
<script src="shortcut-panel.js"></script>
<script src="ocr.js"></script>
<script src="ocr-panel.js"></script>
<script src="profiles.js"></script>
<script src="profile-panel.js"></script>
<script src="atx.js"></script>
<script src="atx-panel.js"></script>
</body>
</html>
