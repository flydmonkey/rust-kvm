[package]
name = "rust-kvm"
version = "0.1.0"
edition = "2024"
# src/bin/probe*.rs 都是诊断工具，cargo run 默认跑服务端
default-run = "rust-kvm"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.12.1"
# realtime 必须显式开：cpal 的 default = []，不开的话采音线程跑在普通优先级上，
# 会被采集卡那 30Mbps 的视频推流和浏览器抢占，错过 10ms 截止时间后 WASAPI 就丢样本
# （表现为 DATA_DISCONTINUITY，人耳听到爆音）。详见 README。
cpal = { version = "0.18.2", features = ["realtime"] }
futures-util = "0.3.34"
local-ip-address = "0.6.13"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
# 解 MJPEG 给编码器喂 NV12。纯 Rust，不引外部 DLL；直出 YCbCr 可以省掉色彩矩阵。
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[target.'cfg(windows)'.dependencies]
# 只为了 timeBeginPeriod：Windows 默认 15.6ms 的定时器精度会把串口轮询卡死在
# 64Hz，键鼠往返直接多出十几毫秒。详见 serial_bridge.rs 里的说明。
windows-sys = { version = "0.61.2", features = ["Win32_Media"] }
# H.264 编码走 Media Foundation。这里非用带包装的 windows crate 不可：MFT 全是 COM
# 接口，而 windows-sys 给的是裸 vtable，手写 QueryInterface 和引用计数不值得。
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # 编码器参数（低延迟、B 帧数、码率模式）走 ICodecAPI::SetValue，值是 VARIANT，
    # 而 VARIANT 同时挂在 Ole 和 Variant 两个 feature 后面，少一个就编译不出来。
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
# 注册成服务跑在 session 0。除了开机自启，这也是唯一能看到物理音频端点的办法：
# 远程桌面会话里那些端点会被换成「远程音频」。详见 service.rs。
windows-service = "0.8.0"

[target.'cfg(not(windows))'.dependencies]
# 没有 Media Foundation 的平台上 H.264 走软件编码。用自带源码编译的版本，不依赖
# 系统里装没装 libopenh264，x86 和 ARM 都一样能编。
openh264 = "0.9.10"

[target.'cfg(target_os = "linux")'.dependencies]
# 只为了 sched_setscheduler：cpal 的 realtime 在 Linux 上只会走 rtkit 的 D-Bus，
# 无头机器上多半没有 rtkit，等于没开。详见 audio.rs 里的 promote_audio_thread。
libc = "0.2"
